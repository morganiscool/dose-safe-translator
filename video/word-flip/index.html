<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=288" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 720px; height: 288px; overflow: hidden; background: #eef1f5; }
    </style>
  </head>
  <body>
    <!-- Dose-Safe Translator: the inline slot in the landing page headline. "more" is struck and comes back as "less". 4 s loop. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="720" data-height="288">
      <div id="flipword" data-composition-id="flipword" data-composition-src="compositions/flipword.html"
           data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="720" data-height="288"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
