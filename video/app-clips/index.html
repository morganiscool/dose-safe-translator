<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=760" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1600px; height: 760px; overflow: hidden; background: #ffffff; }
    </style>
  </head>
  <body>
    <!-- Dose-Safe Translator: the round trip, as a 12 s loop for the empty Translation Facts panel. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1600" data-height="760">
      <div
        id="roundtrip"
        data-composition-id="roundtrip"
        data-composition-src="compositions/roundtrip.html"
        data-start="0"
        data-duration="12"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1600"
        data-height="760"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
