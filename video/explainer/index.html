<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=1920, height=1080" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #ffffff; }
    </style>
  </head>
  <body>
    <!-- Dose-Safe Translator explainer, storyline A (see SPEC.md): one label line's round trip. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="45.3" data-width="1920" data-height="1080">

      <div id="roundtrip" data-composition-id="roundtrip" data-composition-src="compositions/roundtrip.html"
           data-start="16" data-duration="16" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"

    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
