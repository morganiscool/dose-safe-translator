<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0e4c92; }
    </style>
  </head>
  <body>
    <!-- Dose-Safe Translator demo film (see SPEC.md): how the app works, and who it helps. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="45.3" data-width="1920" data-height="1080">
      <div id="counter" data-composition-id="counter" data-composition-src="compositions/counter.html"
           data-start="0" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="risk" data-composition-id="risk" data-composition-src="compositions/risk.html"
           data-start="4.5" data-duration="5.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html"
           data-start="10" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="line" data-composition-id="line" data-composition-src="compositions/line.html"
           data-start="13" data-duration="7.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="barcode" data-composition-id="barcode" data-composition-src="compositions/barcode.html"
           data-start="20.5" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="abroad" data-composition-id="abroad" data-composition-src="compositions/abroad.html"
           data-start="27.5" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="slip" data-composition-id="slip" data-composition-src="compositions/slip.html"
           data-start="34.5" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
           data-start="39.5" data-duration="5.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- Music bed from HeyGen's music library (assets/bgm/CREDITS.md), the same bed as the explainer. -->
      <audio id="bgm" src="assets/bgm/bed.mp3" data-start="0" data-duration="45.3" data-volume="1" data-track-index="2"></audio>

      <!-- Sound on the visible actions (assets/sfx/CREDITS.md), over the bed. -->
      <audio id="sfx-cut-risk" src="assets/sfx/tap.mp3" data-start="4.5" data-duration="0.4" data-volume="0.7" data-track-index="5"></audio>
      <audio id="sfx-strike" src="assets/sfx/pencil.mp3" data-start="7.35" data-duration="1.1" data-volume="0.8" data-track-index="4"></audio>
      <audio id="sfx-reveal" src="assets/sfx/whoosh.mp3" data-start="10.0" data-duration="0.6" data-volume="0.6" data-track-index="3"></audio>
      <audio id="sfx-line-click" src="assets/sfx/click.mp3" data-start="14.87" data-duration="0.6" data-volume="0.8" data-track-index="6"></audio>
      <audio id="sfx-line-checks" src="assets/sfx/typing.mp3" data-start="15.1" data-duration="1.3" data-volume="0.5" data-track-index="7"></audio>
      <audio id="sfx-line-verdict" src="assets/sfx/tap.mp3" data-start="16.43" data-duration="0.4" data-volume="0.8" data-track-index="5"></audio>
      <audio id="sfx-barcode" src="assets/sfx/whoosh.mp3" data-start="20.5" data-duration="0.6" data-volume="0.5" data-track-index="3"></audio>
      <audio id="sfx-label-click" src="assets/sfx/click.mp3" data-start="22.47" data-duration="0.6" data-volume="0.8" data-track-index="6"></audio>
      <audio id="sfx-label-verdict" src="assets/sfx/stamp.mp3" data-start="22.65" data-duration="0.6" data-volume="1" data-track-index="8"></audio>
      <audio id="sfx-abroad" src="assets/sfx/tap.mp3" data-start="27.5" data-duration="0.4" data-volume="0.7" data-track-index="5"></audio>
      <audio id="sfx-pick-click" src="assets/sfx/click.mp3" data-start="31.67" data-duration="0.6" data-volume="0.8" data-track-index="6"></audio>
      <audio id="sfx-slip" src="assets/sfx/whoosh.mp3" data-start="34.5" data-duration="0.6" data-volume="0.5" data-track-index="3"></audio>
      <audio id="sfx-printer" src="assets/sfx/printer.mp3" data-start="34.9" data-duration="3.1" data-volume="0.6" data-track-index="7"></audio>
      <audio id="sfx-endcard" src="assets/sfx/whoosh.mp3" data-start="42.1" data-duration="0.6" data-volume="0.6" data-track-index="3"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
