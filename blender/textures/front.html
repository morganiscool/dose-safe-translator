<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Public Sans"; src: url("../../web/fonts/PublicSans-Variable.ttf"); font-weight: 100 900; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1100px; height: 1800px; overflow: hidden; }
body { background: #0e4c92; color: #fff; font-family: "Public Sans", sans-serif; padding: 110px 90px; position: relative; }
.kind { font-size: 64px; font-weight: 800; letter-spacing: -0.01em; }
.name { font-size: 150px; font-weight: 900; line-height: 0.9; letter-spacing: -0.04em; margin-top: 40px; }
.dose { font-size: 96px; font-weight: 600; margin-top: 30px; }
.pills { position: absolute; left: 150px; top: 860px; width: 800px; height: 380px; }
.pills i { position: absolute; width: 520px; height: 200px; border-radius: 100px; background: #ffffff; }
.pills i:first-child { left: 0; top: 40px; transform: rotate(-14deg); }
.pills i:last-child { left: 260px; top: 170px; transform: rotate(9deg); background: #e8eef6; }
.band { position: absolute; left: 0; right: 0; bottom: 330px; height: 26px; background: #fff; }
.count { position: absolute; left: 90px; bottom: 110px; font-size: 120px; font-weight: 900; letter-spacing: -0.03em; }
.count small { font-size: 56px; font-weight: 600; letter-spacing: 0; }
</style></head>
<body>
  <p class="kind">Pain reliever / fever reducer</p>
  <p class="name">Acetamin&shy;ophen</p>
  <p class="dose">500 mg</p>
  <div class="pills"><i></i><i></i></div>
  <div class="band"></div>
  <p class="count">24 <small>caplets</small></p>
</body></html>
